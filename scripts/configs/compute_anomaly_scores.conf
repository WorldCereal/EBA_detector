# ==============================================================================
# Config for compute_anomaly_scores.sh (modified_algo branch) — edit and
# re-submit with:
#     sbatch compute_anomaly_scores.sh /absolute/path/to/this/file.conf
#
# This is the NEW-METHOD variant of the config on main
# (EBA_detector/scripts/configs/compute_anomaly_scores.conf): same
# INPUT_LONG_DIR / EMBEDDINGS_DB_PATH / MERGED_WIDE_PATH derivation, only
# SUFFIX changed to _newextractions_newmethod so this run reuses the existing
# embeddings cache and merged wide parquet (no need to recompute embeddings —
# SKIP_EMBEDDINGS=true) and writes its outputs side by side with the main-branch
# run under a distinct suffix.
#
# Copy this file (don't edit the tracked default in place for a one-off run)
# and pass the copy's ABSOLUTE path as the sbatch script's argument, e.g.:
#     cp scripts/configs/compute_anomaly_scores.conf scripts/configs/my_run.conf
#     sbatch compute_anomaly_scores.sh /home/.../scripts/configs/my_run.conf
#
# This file is sourced directly by bash, so it must stay valid bash: no spaces
# around '=', quote values with spaces, arrays use the ( ) syntax shown below.
# ==============================================================================

# ------------------------------------------------------------------ MODE
MODE=rerun                    # rerun | update
INPUT_FORMAT=geoparquet       # parquet | geoparquet

# ------------------------------------------------------------------ CORE I/O
INPUT_LONG_DIR=/home/vito/shahs/TestFolder/wc_outliers/data_for_outlier/MERGED_PARQUETS_LOCAL_STORE
SUFFIX=_newextractions_newmethod2
# PARQUET_GLOB=                # leave unset to use the --input-format default

# Optional overrides. Left unset, the script auto-derives these from
# INPUT_LONG_DIR + SUFFIX — but that derivation does NOT match this
# collection's actual layout (wrong case: CACHED_WIDE_MERGED vs
# cached_wide_merged; wrong stem: MERGED_PARQUETS_wide_month vs
# worldcereal_all_extractions_wide_month), so step 10 (wide write-back)
# silently no-ops with just a WARNING when left unset. Pin them explicitly.
# EMBEDDINGS_DB_PATH is pinned to REUSE the embeddings cache already populated
# by the main-branch (_newextractions) run — recomputing 128-d Presto
# embeddings is the expensive step and nothing about this algorithm change
# touches the embeddings themselves, only how they're scored.
WIDE_DIR=/home/vito/shahs/TestFolder/wc_outliers/data_for_outlier/CACHED_WIDE_MERGED/cached_wide_merged/cached_wide_parquets_newextractions_newmethod2
MERGED_WIDE_PATH=/home/vito/shahs/TestFolder/wc_outliers/data_for_outlier/CACHED_WIDE_MERGED/cached_wide_merged/worldcereal_all_extractions_wide_month_newextractions_newmethod2.parquet
EMBEDDINGS_DB_PATH=/home/vito/shahs/TestFolder/wc_outliers/data_for_outlier/EMBEDDINGS_CACHE/embeddings_cache_LANDCOVER10_updated_newextractions_newmethod2.duckdb
# REVIEW_DIR=
# OUTPUT_LONG_DIR=              # geoparquet mode defaults to in-place (== INPUT_LONG_DIR)
# OUTPUT_WIDE_PATH=

# ------------------------------------------------------------------ PRESTO / EMBEDDINGS
PRESTO_URL_OR_PATH="https://artifactory.vgt.vito.be/artifactory/auxdata-public/worldcereal/models/PhaseII/presto-ss-wc_longparquet_random-window-cut_no-time-token_epoch96.pt"
BATCH_SIZE=8024
NUM_WORKERS=8
PARQUET_BATCH_ROWS=300000
FORCE_RECOMPUTE=false
PREMATCH=true

# ------------------------------------------------------------------ CLASS MAPPINGS
# CLASS_MAPPINGS_JSON=          # leave unset to fetch from SharePoint
SP_ENV_FILE="/home/vito/shahs/TestFolder/.sharepointenv"

# ------------------------------------------------------------------ LANDCOVER10 SCORING
LC10_CLASS_MAPPING=LANDCOVER10
LC10_H3_LEVELS="2 3"
LC10_MIN_SLICE_SIZE=200
LC10_MAX_SLICE_SIZE=10000
LC10_MAX_MERGE_ITERATIONS=16
LC10_MAD_K=3.3                 # was 4.0 on the old relative-only method

# ------------------------------------------------------------------ CROPTYPE24 SCORING
CTY24_CLASS_MAPPING=CROPTYPE24
CTY24_H3_LEVELS="2 3 4"
CTY24_MIN_SLICE_SIZE=100
CTY24_MAX_SLICE_SIZE=5000
CTY24_MAX_MERGE_ITERATIONS=8
CTY24_MAD_K=3.3                # was 4.0 on the old relative-only method

# ------------------------------------------------------------------ COMMON SCORING
THRESHOLD_MODE=stable_mad      # was "mad" on the old method — see README "How a sample gets flagged"
PERCENTILE_Q=0.96
NORM_PERCENTILES="2.0 98.0"
FDR_ALPHA=0.05
SKIP_CLASSES="ignore"
# Post-scoring cleanup (independent of SKIP_CLASSES above, which excludes
# samples from scoring entirely): rows whose SCORED class is in this list get
# confidence/flag reset to 1.0/"normal" post-hoc. Rows in a terminal
# non-judged state (unscored/unscorable/unmapped/skipped) are left alone
# either way. Matches the notebook's POST_PROCESSING_SKIP_CLASSES.
# Set to "" to disable.
POST_PROCESSING_SKIP_CLASSES="ignore trees no_crop"
MAX_FULL_PAIRWISE_N=0

# --- slice / context definition (NEW on this branch) -----------------------
# Default ["ref_id"]: each source dataset is scored against itself, so one
# dataset's labelling convention cannot contaminate another's reference
# cloud. Set to "" (empty) to pool across datasets instead (the old
# main-branch behaviour) — see AnomalyRunConfig.group_cols docstring for the
# measured case where pooling was required to catch a wholly-mislabelled
# dataset that group_cols=["ref_id"] made invisible.
GROUP_COLS=""
# CONTEXT_GROUP_COLS=           # leave unset/empty: context stays geographic
# TIME_COL=year                 # set if you have a year/season column — see README

# --- absolute-scale gate (NEW on this branch) -------------------------------
# The core change: a flag now needs BOTH a within-slice signal (MAD_K above)
# AND an absolute one (ABS_Z_K here) against a null pooled across many slices
# of the same class. Set NO_ABSOLUTE_GATE=true to reproduce the old
# relative-only behaviour for an ablation.
NO_ABSOLUTE_GATE=false
ABS_Z_K=3.3
ABS_Z_SUSPECT=4.0
ABS_Z_CANDIDATE=5.5
NULL_SCALE_ESTIMATOR=left_tail  # left_tail (median-q25) resists whole-slice contamination; "mad" = legacy, ablation only
ABS_COMBINE=min                 # min = demand both centroid AND kNN evidence
# Cross-slice null conditioning: region-localised with shrinkage toward the
# global null (see README "Known limit" / calibration.py).
#
# NULL_EXTRA_KEYS is a NESTING, coarsest first: the null is estimated at every
# prefix ("class", then "class x region", then "class x region x resolution")
# and each row is calibrated against the finest group that exists for it, so
# adding a conditioner cannot strand a thin group on the flat global null.
# h3_null_res is what stops L2/L3/L4 slices sharing one null — it matters here
# because CTY24 runs 3 levels (see CTY24_H3_LEVELS above).
NULL_EXTRA_KEYS="h3_null_region h3_null_res"
# The region is now defined RELATIVE to each slice's own H3 resolution:
#     region_level = max(slice_res - NULL_REGION_OFFSET, NULL_REGION_MIN_LEVEL)
# so every slice is calibrated against ~the same NUMBER of sibling cells no
# matter what resolution it resolved at. A fixed ABSOLUTE level mixes
# resolutions into one null group and was measurably worse than no region at
# all on a 3-level (CROPTYPE24) run.
NULL_REGION_OFFSET=2
NULL_REGION_MIN_LEVEL=1
# Legacy absolute override: pin a fixed region resolution instead of the
# relative offset above. -1 = use the offset (recommended). Setting this to a
# positive level reinstates the old, measurably worse fixed-level behaviour.
NULL_REGION_LEVEL=-1
NULL_SHRINK_K=5.0
PURITY_VETO=0.80                 # cap escalation at "flagged" when this fraction of neighbours share the point's label; 1.1 disables
MIN_SCORING_SLICE_SIZE=50
STRICT_QUALITY=false             # true -> hard-error on mixed model_hash / H3 mismatch instead of warning
NO_QUALITY_GATE=false            # true -> skip embedding validation (not recommended)

# --- centroid / confidence shaping ------------------------------------------
CENTROID_MODE=trimmed
CENTROID_TRIM=0.45               # higher than the pre-absolute-gate default (0.05) — see AnomalyRunConfig docstring
GATE_CONFIDENCE_BY_FLAG=true
APPLY_SLICE_TRUST=false
SLICE_TRUST_MIN=0.05

# ------------------------------------------------------------------ UPDATE MODE
NEIGHBOUR_RINGS=1

# ------------------------------------------------------------------ OVERWRITE FLAGS
# Step 3 builds its merge list from the wide dir itself, not only from the
# wide files mapped back to an input long parquet. Set false to merge only
# those mapped from INPUT_LONG_DIR. Keep true when the wide dir has been
# backfilled with parquets copied in from an earlier run whose long-format
# sources were never staged here — otherwise those datasets are absent from
# the merged wide parquet and step 10 has no row to write their scores onto.
RESCAN_WIDE_DIR=true

OVERWRITE_WIDE=false
OVERWRITE_MERGED=false
OVERWRITE_SCORES=true
OVERWRITE_MERGED_SCORES=true
OVERWRITE_WIDE_SCORES=true

# ------------------------------------------------------------------ SKIP FLAGS
SKIP_EMBEDDINGS=false           # reuse the embeddings cache pinned above — this run only changes scoring, not embeddings
SKIP_SCORING=false
SKIP_WRITE_BACK=false          # true -> skip BOTH long and wide write-back (steps 9+10)
# Long-format parquets aren't always all present in INPUT_LONG_DIR (unlike the
# merged wide parquet, which always exists) — set this true to skip step 9
# only and still get scores appended to the wide/merged parquet in step 10.
SKIP_LONG_WRITE_BACK=false
SKIP_WIDE_WRITE_BACK=false

# ------------------------------------------------------------------ MISC
# COMPUTE_H3_LEVELS=h3_levels   # leave unset to skip
LOG_LEVEL=INFO

# ------------------------------------------------------------------ SLURM RESOURCES
# High-memory CPU job — LC10/CTY24 scoring loads the full embeddings cache into
# RAM. This cluster has no separate bigmem partition — 'normal' nodes go up to
# ~512gb, so request a big slice of one of those instead of a dedicated GPU/dev
# node. The absolute-gate null computation is an extra pass over the scored
# data on top of the old method, so keep headroom similar to (or slightly
# above) the main-branch run.
CONDA_ENV=worldcereal-py311
PARTITION=normal
CPUS=16
MEM=90gb
TIME=12:00:00
